services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
    environment:
      - ONTOLOGY_PATH=/app/data/ontology_grnti.json
      - ONTOLOGY_SNAPSHOTS_DIR=/app/data/snapshots
      - OPENAI_EMBEDDINGS_BASE_URL=${OPENAI_EMBEDDINGS_BASE_URL:-}
      - OPENAI_EMBEDDINGS_TOKEN=${OPENAI_EMBEDDINGS_TOKEN:-}
      - OPENAI_EMBEDDINGS_MODEL=${OPENAI_EMBEDDINGS_MODEL:-openai/text-embedding-3-small}
      - GIGACHAT_BASE_URL=${GIGACHAT_BASE_URL:-}
      - GIGACHAT_TOKEN=${GIGACHAT_TOKEN:-}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS:-}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat-Pro}
      - GIGACHAT_VERIFY_SSL=${GIGACHAT_VERIFY_SSL:-false}
      - YAGPT_BASE_URL=${YAGPT_BASE_URL:-}
      - YAGPT_TOKEN=${YAGPT_TOKEN:-}
      - YAGPT_MODEL=${YAGPT_MODEL:-yandexgpt}
      - MOCK_LLM=${MOCK_LLM:-false}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_KEY=${S3_KEY:-ontology_grnti.json}
      - S3_EMBEDDINGS_KEY=${S3_EMBEDDINGS_KEY:-embeddings_cache.pkl.gz}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-https://storage.yandexcloud.net}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
