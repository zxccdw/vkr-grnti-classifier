<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обозреватель онтологии ГРНТИ</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/browse.css?v=12">
</head>
<body class="browse-body">
    <header class="browse-header">
        <h1>Обозреватель онтологии ГРНТИ</h1>
        <div class="header-actions">
            <label class="btn-secondary header-btn" for="import-input" style="display:none">Загрузить JSON</label>
            <input id="import-input" type="file" accept="application/json,.json" style="display:none">
<button id="export-btn" class="btn-secondary header-btn">Скачать JSON</button>
            <button id="merge-btn" class="btn-secondary">Объединить дубликаты</button>
            <button id="backfill-btn" class="btn-secondary" disabled>Догнать описания</button>
            <button id="pending-btn" class="btn-secondary">Pending ▾</button>
            <a href="/">← Классификатор</a>
        </div>
    </header>

    <div id="pending-popup" hidden style="
        position:fixed; top:56px; right:16px; width:360px; max-height:400px;
        overflow-y:auto; background:#fff; border:1px solid #e2e8f0;
        border-radius:10px; box-shadow:0 4px 24px rgba(0,0,0,.12);
        padding:12px; z-index:1000; font-size:0.8rem;
    ">
        <div style="font-weight:600; margin-bottom:8px; color:#64748b;">УЗЛЫ БЕЗ ОПИСАНИЯ</div>
        <div id="pending-list"></div>
    </div>

    <main class="browse-layout">
        <aside class="panel panel-left">
            <h2>Скоуп</h2>
            <label for="l1-input">Раздел:</label>
            <div class="combobox" data-cb="l1">
                <input id="l1-input" type="text" autocomplete="off"
                       placeholder="Код или название (например: 34 или Биология)">
                <div class="combobox-popup" hidden></div>
            </div>

            <label for="l2-input">Подраздел:</label>
            <div class="combobox" data-cb="l2">
                <input id="l2-input" type="text" autocomplete="off" disabled
                       placeholder="Опционально">
                <div class="combobox-popup" hidden></div>
            </div>

<div style="display: flex; gap: 0.5rem;">
                <button id="open-btn" class="btn-primary" disabled>Открыть</button>
                <button id="reset-btn" class="btn-secondary">Сбросить</button>
            </div>
            <div id="status-msg" class="status-msg"></div>
        </aside>

        <section class="panel panel-center">
            <svg id="graph"></svg>
        </section>

        <aside class="panel panel-right">
            <h2>Узел</h2>
            <div id="node-details" class="node-details">
                <p class="muted">Кликни по узлу графа.</p>
            </div>
            <button id="add-btn" class="btn-primary" disabled>+ Создать дочерний</button>
            <button id="attach-btn" class="btn-secondary" disabled>+ Привязать существующий</button>
        </aside>
    </main>

    <div id="modal-add" class="modal" hidden>
        <div class="modal-card">
            <h3>Новый дочерний узел</h3>
            <p id="modal-add-parent" class="muted"></p>
            <label for="new-label">Название</label>
            <input id="new-label" type="text" maxlength="300" placeholder="Например, Протеомика">
            <div id="modal-add-similar" class="similar-nodes" hidden>
                <p class="similar-nodes-title">Похожие в онтологии:</p>
                <div id="modal-add-similar-list"></div>
            </div>
            <label for="new-code">Код ГРНТИ</label>
            <input id="new-code" type="text" maxlength="50" placeholder="34.15.99">
            <div id="modal-add-error" class="error-msg" hidden></div>
            <div class="modal-actions">
                <button id="modal-add-cancel" class="btn-secondary">Отмена</button>
                <button id="modal-add-submit" class="btn-primary">Создать</button>
            </div>
            <div id="modal-add-loader" class="muted" hidden>LLM думают…</div>
        </div>
    </div>

    <div id="modal-attach" class="modal" hidden>
        <div class="modal-card">
            <h3>Привязать существующий узел</h3>
            <p id="modal-attach-parent" class="muted"></p>
            <label for="attach-target">Целевой узел</label>
            <div class="combobox" data-cb="attach">
                <input id="attach-target" type="text" autocomplete="off"
                       placeholder="Код или название узла">
                <div class="combobox-popup" hidden></div>
            </div>
            <div id="modal-attach-error" class="error-msg" hidden></div>
            <div class="modal-actions">
                <button id="modal-attach-cancel" class="btn-secondary">Отмена</button>
                <button id="modal-attach-submit" class="btn-primary">Привязать + сгенерировать</button>
            </div>
            <div id="modal-attach-loader" class="muted" hidden>LLM думают…</div>
        </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/static/browse.js?v=13"></script>
</body>
</html>
