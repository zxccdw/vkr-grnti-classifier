<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - GRNTI Web</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.12);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: 500;
            color: #334155;
        }
        .form-group input {
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .login-btn {
            margin-top: 8px;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .login-btn:hover {
            background: #2563eb;
        }
        .error-msg {
            color: #dc2626;
            background: #fee;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔒 GRNTI Web</h1>
            <p style="color: #64748b;">Введите учетные данные</p>
        </div>
        <form class="login-form" id="loginForm">
            <div id="errorMsg" class="error-msg"></div>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn">Войти</button>
        </form>
    </div>

    <script>
        document.cookie = 'auth=; path=/; max-age=0; SameSite=Lax';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const credentials = btoa(username + ':' + password);

            try {
                const response = await fetch('/api/v1/search?q=test', {
                    headers: {
                        'Authorization': 'Basic ' + credentials
                    }
                });

                if (response.ok) {
                    document.cookie = `auth=${credentials}; path=/; max-age=86400; SameSite=Lax`;
                    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/browse';
                    window.location.href = redirect;
                } else {
                    errorMsg.textContent = 'Неверный логин или пароль';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Ошибка подключения к серверу';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
